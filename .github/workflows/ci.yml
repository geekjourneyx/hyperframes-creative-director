name: Validate skill
on:
  push:
  pull_request:
  workflow_dispatch:
env:
  HYPERFRAMES_NO_TELEMETRY: '1'
  DO_NOT_TRACK: '1'
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm test
      - run: npm run check:package
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - if: runner.os == 'macOS'
        run: brew install ffmpeg
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Use installed Chromium for both test and renderer
        shell: bash
        run: node --input-type=module -e "import {chromium} from '@playwright/test'; console.log('CHROMIUM_PATH='+chromium.executablePath())" >> "$GITHUB_ENV"
      - run: npm run test:integration

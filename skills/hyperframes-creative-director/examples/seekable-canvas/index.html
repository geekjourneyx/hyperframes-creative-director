<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Seekable scene reference</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden}#root{width:100%;height:100%;position:relative}canvas{width:100%;height:100%;display:block}</style></head>
<body>
<div id="root" data-composition-id="main" data-no-timeline data-start="0" data-duration="3" data-width="640" data-height="360" data-fps="30">
<canvas id="scene" width="640" height="360" aria-label="Deterministic moving forms"></canvas>
</div>
<script type="module">
import { createCanvasScene } from './canvas-scene.mjs';
import { createWebGLScene } from './webgl-scene.mjs';
const options = new URLSearchParams(location.search);
const seed = Number(options.get('seed') ?? 7);
let scene;
let time = 0;
window.__hf = window.__hf || {};
window.__hf.buildReady = window.__hf.buildReady || {};
// Register the promise before asynchronous assets or scene creation begin.
window.__hf.buildReady.scene = (async () => {
  await document.fonts.ready;
  scene = (options.get('mode') === 'webgl' ? createWebGLScene : createCanvasScene)(document.querySelector('canvas'), seed);
  renderAt(time);
  window.sceneReady = true;
})();
function renderAt(seconds) {
  time = Math.max(0, seconds);
  window.sceneShot = time < 1 ? 'opening' : 'arrival';
  scene?.renderAt(time);
}
window.addEventListener('hf-seek', event => renderAt(event.detail.time));
</script>
</body>
</html>
